<svg width="177" height="24" viewBox="0 0 177 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo icon (B in circle) -->
  <circle cx="12" cy="12" r="10" fill="url(#bgGradient)" stroke="#1f2937" stroke-width="0.5"/>
  <text x="12" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">B</text>
  
  <!-- Search icon overlapping bottom right of B -->
  <circle cx="14" cy="14" r="1.5" fill="none" stroke="white" stroke-width="0.8" opacity="0.9"/>
  <line x1="15" y1="15.5" x2="16" y2="17" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Data dots representing AI/leads -->
  <circle cx="18" cy="6" r="0.8" fill="#60a5fa" opacity="0.8"/>
  <circle cx="6" cy="18" r="0.8" fill="#a855f7" opacity="0.8"/>
  
  <!-- Biznomate text -->
  <text x="32" y="16" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#09090B">Biznomate</text>
</svg>
