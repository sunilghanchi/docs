<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="5.625" dy="5.625" stdDeviation="5.625" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="90" cy="90" r="85" fill="url(#bgGradient)" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Centered "B" letter -->
  <text x="90" y="123.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="101.25" font-weight="bold" fill="white">B</text>
  
  <!-- Search icon overlapping bottom right of B with black border -->
  <circle cx="101.25" cy="112.5" r="11.25" fill="none" stroke="black" stroke-width="5.625" opacity="0.9" filter="url(#shadow)"/>
  <line x1="109.6875" y1="120.9375" x2="118.125" y2="129.375" stroke="black" stroke-width="5.625" stroke-linecap="round" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Data dots representing AI/leads -->
  <circle cx="135" cy="45" r="5.625" fill="#60a5fa" opacity="0.8"/>
  <circle cx="45" cy="135" r="5.625" fill="#a855f7" opacity="0.8"/>
  <circle cx="135" cy="135" r="5.625" fill="#60a5fa" opacity="0.8"/>
  
  <!-- Pulse animation for data flow -->
  <circle cx="135" cy="45" r="2.8125" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="135" r="2.8125" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg> 